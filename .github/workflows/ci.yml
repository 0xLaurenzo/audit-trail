name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # --experimental-strip-types runs the .ts sources directly.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

  test-macos:
    name: Type-check and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check

  nix-package:
    name: Build and smoke-test Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build package
        id: build
        run: echo "out=$(nix build .# --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
      - name: Verify installed bundle
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          test -x "$OUT/bin/audit-trail"
          test -f "$OUT/share/pi-audit-trail/.claude-plugin/plugin.json"
          test -f "$OUT/share/pi-audit-trail/.codex-plugin/plugin.json"
          test -f "$OUT/share/pi-audit-trail/.mcp.json"
          test -f "$OUT/share/pi-audit-trail/hooks/hooks.json"
          test -f "$OUT/share/pi-audit-trail/skills/audit-trail/SKILL.md"
          "$OUT/bin/audit-trail" help | grep -q "Usage: audit-trail"

          worktree="$(mktemp -d)"
          trap 'rm -rf "$worktree"' EXIT
          "$OUT/bin/audit-trail" -C "$worktree" start ci-smoke
          test -f "$worktree/.audit/ci-smoke.tsv"
          "$OUT/bin/audit-trail" -C "$worktree" status | grep -q "ci-smoke"
